<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatilho OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <input type="search" id="search" placeholder="Buscar..." aria-label="Buscar">
    <div class="actions">
      <button id="newCardBtn">Novo Card</button>
      <button id="newDiaryBtn">Novo Diário</button>
      <button id="exportBtn">Exportar</button>
      <button id="importBtn">Importar</button>
      <button id="statsBtn">Estatísticas</button>
      <button id="themeBtn">Tema</button>
      <input type="file" id="importFile" accept="application/json" aria-hidden="true" hidden>
    </div>
  </header>

  <main>
    <section id="board" aria-label="Quadro Kanban"></section>
    <aside id="sidebar">
      <section id="ritual">
        <h2>Ritual Diário</h2>
        <ul id="ritualList"></ul>
      </section>
      <section id="agenda">
        <h2>Agenda</h2>
        <ul id="agendaList"></ul>
      </section>
      <section id="quickDiary">
        <h2>Entrada rápida</h2>
        <form id="quickDiaryForm">
          <input type="text" id="quickDiaryTitle" placeholder="Título">
          <textarea id="quickDiaryText" placeholder="Texto"></textarea>
          <button type="submit">Salvar</button>
        </form>
      </section>
    </aside>
  </main>

  <div id="cardModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <form id="cardForm">
        <h2>Card</h2>
        <label>Título<input id="cardTitle" required></label>
        <label>Descrição<textarea id="cardDesc"></textarea></label>
        <label>Pilar
          <select id="cardPilar">
            <option>Backlog</option>
            <option>Despertar</option>
            <option>Santidade</option>
            <option>Influência</option>
            <option>Obediência</option>
            <option>Paixão</option>
            <option>Coragem</option>
            <option>Urgência</option>
            <option>Concluído</option>
          </select>
        </label>
        <label>Prioridade
          <select id="cardPriority">
            <option>Baixa</option>
            <option selected>Média</option>
            <option>Alta</option>
          </select>
        </label>
        <label>Data/Hora<input type="datetime-local" id="cardDate"></label>
        <label>Tags<input id="cardTags" placeholder="tag1,tag2"></label>
        <div class="subtasks">
          <h3>Checklist</h3>
          <ul id="subtaskList"></ul>
          <button type="button" id="addSubtask">Adicionar</button>
        </div>
        <div class="modal-actions">
          <button type="submit">Salvar</button>
          <button type="button" id="cardCancel">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="diaryModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <form id="diaryForm">
        <h2>Novo Diário</h2>
        <label>Título<input id="diaryTitle"></label>
        <label>Texto<textarea id="diaryText" required></textarea></label>
        <fieldset>
          <legend>Tags</legend>
          <label><input type="checkbox" value="Gratidão"> Gratidão</label>
          <label><input type="checkbox" value="Confronto"> Confronto</label>
          <label><input type="checkbox" value="Revelação"> Revelação</label>
        </fieldset>
        <label>Card Relacionado
          <select id="diaryCard"><option value="">Nenhum</option></select>
        </label>
        <div class="modal-actions">
          <button type="submit">Salvar</button>
          <button type="button" id="diaryCancel">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="statsModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <h2>Estatísticas</h2>
      <div id="statsContent"></div>
      <div class="modal-actions">
        <button id="statsClose">Fechar</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
